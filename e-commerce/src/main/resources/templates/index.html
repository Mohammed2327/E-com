<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"> <!-- Link to CSS -->
</head>
<body>
    <div class="container">
        <div class="content">
            <div class="product-container">
                <h1 class="title">Our Products</h1>
                <div class="product-list">
                    <div class="product-grid" id="product-grid">
                        <div th:each="product : ${products}" class="product-card">
                            <img th:src="@{/images/products/{imageName}(imageName=${product.image})}" alt="${product.title}">
                            <h3 th:text="${product.title}"></h3>
                            <p th:text="${product.price}"></p>
                            <button th:onclick="'addToCart(' + ${product.id} + ', \'' + ${product.title} + '\', ' + ${product.price} + ')'">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="cart-container">
                <h2 class="cart-title">Shopping Cart</h2>
                <div class="shopping-cart">
                    <ul id="cart-items">
                        <li th:each="item : ${cartItems}">
                            <span class="cart-item-title" th:text="${item.title}"></span>
                            <span>Quantity: <span th:id="'quantity-' + ${item.id}" th:text="${item.quantity}"></span></span>
                            <div class="cart-item-buttons">
                                <button onclick="increaseQuantity(${item.id})">+</button>
                                <button onclick="decreaseQuantity(${item.id})">-</button>
                                <button onclick="removeFromCart(${item.id})">Remove</button>
                            </div>
                            <span th:text="'$' + ${item.price * item.quantity}"></span>
                        </li>
                    </ul>
                    <div class="cart-footer">
                        <p id="total-price">Total: $0.00</p>
                        <button id="checkout-button" onclick="showCheckoutModal()">Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>Order Receipt</h2>
            <div id="receipt">
                <div class="receipt-item" th:each="item : ${cartItems}">
                    <span th:text="${item.title}"></span>
                    <span th:text="'$' + ${item.price * item.quantity}"></span>
                </div>
                <div class="receipt-total">
                    <span>Total:</span>
                    <span th:text="'$' + ${totalPrice}" style="font-weight: bold;"></span>
                </div>
            </div>
            <div class="cart-footer">
                <button onclick="confirmPurchase()">Confirm Purchase</button>
            </div>
        </div>
    </div>

    <script th:src="@{/js/script.js}"></script> <!-- Link to JavaScript -->
</body>
</html>
